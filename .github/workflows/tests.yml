name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distro dependencies
        run: |
          sudo apt-get update
          # gir1.2-gtk-3.0 provides the Gtk typelib the Connect Agent panel imports.
          sudo apt-get install -y inkscape python3-lxml python3-gi gir1.2-gtk-3.0
      - name: Run tests without PyPI dependencies
        run: /usr/bin/python3 -m unittest discover -s tests -v
